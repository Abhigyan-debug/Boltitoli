<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16254A" />
    <meta name="description" content="BoltiToli is a Hindi voice helper that runs 15-minute guided maths practice for one group of children while the teacher works with another." />
    <title>BoltiToli — Hindi voice helper for multigrade classrooms</title>
  </head>
  <body>
    <!-- Instant splash while the app's JavaScript downloads (6+ s on slow 3G); React replaces it on first render. -->
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:#f6ead8;font-family:system-ui,sans-serif" role="status" aria-label="BoltiToli is loading">
      <div style="text-align:center">
        <svg viewBox="0 0 40 40" width="64" height="64" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#16254a"/><path d="M10 19a10 10 0 0 1 20 0M15 19a5 5 0 0 1 10 0" fill="none" stroke="#f28a1e" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="28" r="3.4" fill="#f7f3ec"/><circle cx="20" cy="28" r="3.4" fill="#f7f3ec"/><circle cx="28" cy="28" r="3.4" fill="#f7f3ec"/></svg>
        <p style="margin:12px 0 0;font-size:26px;font-weight:800;color:#16254a">Bolti<span style="color:#d2650c">Toli</span></p>
        <p style="margin:4px 0 0;color:#556078">बोलती टोली · लोड हो रहा है…</p>
      </div>
    </div></div>
    <noscript>BoltiToli needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
