[project]
name = "boltitoli-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
  "B008",   # FastAPI Depends()/File() in defaults is idiomatic
  "S101",   # asserts in tests
  "S105", "S106",  # dev-only default secret is guarded by validate_for_production()
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "B017"]
"alembic/*" = ["E501"]
