server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API and docs are proxied to the backend container.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # The service worker and manifest must never be cached long-term.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Hashed build assets can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-page app routes.
  location / { try_files $uri /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "microphone=(self), camera=()" always;
}
